version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-postgres}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
    volumes:
      - ./services/shared/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No published host port: only services on the compose network should
    # reach Postgres directly. Use `docker compose exec postgres psql ...`
    # for local inspection instead of a host port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # No published host port: only services on the compose network should
    # reach Redis directly. Use `docker compose exec redis redis-cli` for
    # local inspection instead of a host port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    hostname: kafka
    container_name: kafka
    user: root
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    depends_on:
      postgres:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      AUTH_TOKEN_EXP_MIN: '15'
      REFRESH_TOKEN_EXP_HOUR: '24'
    # No published host port: Kong is the only ingress (see gateway/kong.yml).
    # Publishing this would let callers bypass jwt verification/rate limiting
    # entirely by hitting the service directly.
    depends_on:
      postgres:
        condition: service_healthy

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      SERVICE_PORT: '8001'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8002'
      REDIS_URL: redis:6379
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      SERVICE_PORT: '8003'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      APP_ENV: '${APP_ENV:-}'
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8005'
      PLATFORM_COMMISSION_BPS: '2000'
      MAX_PAYMENT_ATTEMPTS: '3'
      PAYMENT_BACKOFF: '1m,5m,30m'
      CHARGE_WORKER_INTERVAL_SEC: '5'
      CHARGE_LEASE: '2m'
      # PAYMENT_PROVIDER stays 'stub' by default so the stack and the
      # continuously-running e2e-test simulator stay offline, deterministic
      # and free. Set PAYMENT_PROVIDER=stripe and STRIPE_SECRET_KEY (a
      # sandbox/test-mode sk_test_... key — real payments are never in
      # scope) via a root .env file to exercise the real adapter; see
      # .env.example.
      PAYMENT_PROVIDER: '${PAYMENT_PROVIDER:-stub}'
      STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY:-}'
      # The Stripe CLI (`stripe listen`) prints its own whsec_... on
      # startup, distinct from any Dashboard-registered endpoint secret —
      # that printed value is what goes here for local webhook delivery.
      STRIPE_WEBHOOK_SECRET: '${STRIPE_WEBHOOK_SECRET:-}'
      STRIPE_TIMEOUT_SEC: '20'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kong:
    image: kong:3.7
    restart: unless-stopped
    # 512m was observed pinning Kong at ~100% memory under e2e-test load,
    # triggering an OOM-kill crash loop on its nginx worker processes
    # (SIGKILL, restart, repeat) — every in-flight request against a killed
    # worker sees its connection reset (EOF client-side). Root cause:
    # KONG_NGINX_WORKER_PROCESSES defaults to 'auto' (one Lua-VM worker per
    # host CPU core) — on a 16-core dev machine that's 16 workers and
    # ~1GB baseline memory before any traffic at all. Pinned to a small
    # fixed count below, which is what dropped baseline usage low enough
    # for this limit to actually have headroom.
    mem_limit: 512m
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '127.0.0.1:8001'
      KONG_NGINX_WORKER_PROCESSES: '2'
      KONG_LOG_LEVEL: notice
      # pre/post-function plugins run in a Lua sandbox that blocks require()
      # by default; explicitly allowlist the one module our header-injection
      # script needs (see gateway/kong.yml) rather than disabling the sandbox.
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: 'cjson.safe'
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "5173:80"
    depends_on:
      - kong

networks:
  default:
    driver: bridge
