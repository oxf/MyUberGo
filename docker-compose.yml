version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-postgres}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
    # No published host port — only services on the compose network reach Postgres.
    # Use `docker compose exec postgres psql ...` for local inspection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies services/shared/migrations/sql/*.up.sql via golang-migrate, replacing
  # postgres's docker-entrypoint-initdb.d mount so new migrations apply without a volume wipe.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./services/shared/migrations/sql:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      - "up"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # No published host port — only services on the compose network reach Redis.
    # Use `docker compose exec redis redis-cli` for local inspection.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    hostname: kafka
    container_name: kafka
    user: root
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    # Pinned, not :latest — PLAN.md documents a `latest` pull once silently
    # renaming/deprecating component type names this config depended on.
    image: otel/opentelemetry-collector-contrib:0.114.0
    # Runs as root: the image's non-root UID (10001) can't mkdir under /var/lib/otelcol
    # for file_storage's persistent queue. Fine for local/demo; use a chowned image before real deploys.
    user: "0:0"
    restart: unless-stopped
    mem_limit: 512m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - otelcol-storage:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"
      - "4318:4318"
    # No Docker healthcheck: the image ships no shell/wget/curl/busybox and has no healthcheck subcommand.
    # The health_check extension (:13133) plus Prometheus's otel-collector scrape job (see prometheus.yaml) cover liveness instead.
    depends_on:
      kafka:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    # v3.x, not v2.x: --web.enable-otlp-receiver doesn't exist before v3.0 —
    # verified empirically, v2.55.1 refuses to start with "unknown long flag".
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    mem_limit: 512m
    # Caps the exemplar-WAL-replay warning burst (see docs/CHANGELOG.md 2026-08-21) from
    # filling disk with an unbounded json-file log after an unclean container stop.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
      # Explicit rather than the identical 15d built-in default, plus a size guard
      # the default lacks — stops an unbounded cardinality bug from filling the disk.
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/prometheus-rules.yaml:/etc/prometheus/prometheus-rules.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    mem_limit: 128m
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml"]
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceqlSearch
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
      loki:
        condition: service_started

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      AUTH_TOKEN_EXP_MIN: '15'
      REFRESH_TOKEN_EXP_HOUR: '24'
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port: Kong is the only ingress (see gateway/kong.yml) —
    # publishing this would let callers bypass jwt verification/rate limiting.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      SERVICE_PORT: '8001'
      OTEL_SERVICE_NAME: ride-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8002'
      REDIS_URL: redis:6379
      # location-service's internal nearby-drivers endpoint (LOCATION_SPEC.md §2.2); falls back to
      # the rating-only pool on error, so deliberately not a depends_on — matching must work either way.
      LOCATION_URL: http://location-service:8004
      OTEL_SERVICE_NAME: matching-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port: Kong is the only ingress (see gateway/kong.yml) —
    # publishing this would let callers bypass jwt verification/rate limiting.
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: '${JWT_SECRET:-secret_change_me}'
      APP_ENV: '${APP_ENV:-}'
      SERVICE_PORT: '8003'
      OTEL_SERVICE_NAME: driver-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  location-service:
    build:
      context: .
      dockerfile: services/location-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8004'
      REDIS_URL: redis:6379
      LOCATION_STALENESS_SECONDS: '120'
      LOCATION_SWEEP_INTERVAL_SECONDS: '30'
      LOCATION_MAX_ACCURACY_M: '100'
      LOCATION_MAX_SPEED_KMH: '200'
      LOCATION_MAX_FUTURE_SKEW_SECONDS: '120'
      LOCATION_MAX_PAST_SKEW_SECONDS: '600'
      OTEL_SERVICE_NAME: location-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port (Kong is the sole ingress); GET /internal/drivers/nearby is never
    # Kong-routed, reachable only from matching-service. Redis + Kafka only — Postgres arrives in Slice 3.
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PG_DSN: 'postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable'
      APP_ENV: '${APP_ENV:-}'
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8005'
      PLATFORM_COMMISSION_BPS: '2000'
      MAX_PAYMENT_ATTEMPTS: '3'
      PAYMENT_BACKOFF: '1m,5m,30m'
      CHARGE_WORKER_INTERVAL_SEC: '5'
      CHARGE_LEASE: '2m'
      # Stays 'stub' by default so the stack and e2e-test simulator remain offline/deterministic/free.
      # Set PAYMENT_PROVIDER=stripe + STRIPE_SECRET_KEY (sk_test_... only) via a root .env for the real adapter; see .env.example.
      PAYMENT_PROVIDER: '${PAYMENT_PROVIDER:-stub}'
      STRIPE_SECRET_KEY: '${STRIPE_SECRET_KEY:-}'
      # The Stripe CLI (`stripe listen`) prints its own whsec_..., distinct from any
      # Dashboard-registered endpoint secret — that printed value goes here for local webhook delivery.
      STRIPE_WEBHOOK_SECRET: '${STRIPE_WEBHOOK_SECRET:-}'
      STRIPE_TIMEOUT_SEC: '20'
      OTEL_SERVICE_NAME: billing-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=myubergo,deployment.environment=${APP_ENV:-local},service.version=${GIT_SHA:-dev}'
      OTEL_TRACES_SAMPLER: parentbased_always_on
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started

  kong:
    image: kong:3.7
    restart: unless-stopped
    # 512m: unpinned 'auto' worker count (one Lua-VM per CPU core) was observed OOM-killing
    # Kong's nginx workers under e2e-test load; pinning KONG_NGINX_WORKER_PROCESSES below fixed it.
    mem_limit: 512m
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '127.0.0.1:8001'
      KONG_NGINX_WORKER_PROCESSES: '2'
      KONG_LOG_LEVEL: notice
      # pre/post-function plugins sandbox require() by default; explicitly allowlist
      # the one module the header-injection script needs (see gateway/kong.yml).
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: 'cjson.safe'
      # Kong's own internal spans (router/DNS/balancer/plugin phases), exported via
      # the opentelemetry plugin — still emits a root span per request even at 'off'.
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: '1.0'
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "5173:80"
    depends_on:
      - kong

networks:
  default:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  otelcol-storage:
  alertmanager-data:
