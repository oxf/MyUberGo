version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./services/shared/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    hostname: kafka
    container_name: kafka
    user: root
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    depends_on:
      postgres:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=PLAINTEXT

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      JWT_SECRET: secret_change_me
      AUTH_TOKEN_EXP_MIN: '15'
      REFRESH_TOKEN_EXP_HOUR: '24'
    # No published host port: Kong is the only ingress (see gateway/kong.yml).
    # Publishing this would let callers bypass jwt verification/rate limiting
    # entirely by hitting the service directly.
    depends_on:
      postgres:
        condition: service_healthy

  ride-service:
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: secret_change_me
      SERVICE_PORT: '8001'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    environment:
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8002'
      REDIS_URL: redis:6379
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      KAFKA_BROKER: kafka:29092
      JWT_SECRET: secret_change_me
      SERVICE_PORT: '8003'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      KAFKA_BROKER: kafka:29092
      SERVICE_PORT: '8005'
      PLATFORM_COMMISSION_BPS: '2000'
      MAX_PAYMENT_ATTEMPTS: '3'
      PAYMENT_BACKOFF: '1m,5m,30m'
      CHARGE_WORKER_INTERVAL_SEC: '5'
    # No published host port — see the note on auth-service above.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '127.0.0.1:8001'
      KONG_LOG_LEVEL: notice
      # pre/post-function plugins run in a Lua sandbox that blocks require()
      # by default; explicitly allowlist the one module our header-injection
      # script needs (see gateway/kong.yml) rather than disabling the sandbox.
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: 'cjson.safe'
    volumes:
      - ./gateway/kong.yml:/kong/kong.yml:ro
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      ride-service:
        condition: service_started
      driver-service:
        condition: service_started
      billing-service:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - kong

networks:
  default:
    driver: bridge
