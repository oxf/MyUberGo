_format_version: "3.0"
_transform: true

# Single consumer representing "any authenticated MyUberGo user" — every
# access token shares the same iss/HS256 secret, so they all resolve to this
# one consumer. Per-user identity comes from the token's user_id/email/role
# claims, injected as X-User-* headers by the post-function plugin below, not
# from Kong's consumer model. Per-user *rate limiting* therefore keys off the
# injected X-User-Id header (limit_by: header), not off the consumer.
consumers:
  - username: myubergo-app
    jwt_secrets:
      - key: myubergo-auth # must match the "iss" claim auth-service mints (see tokenIssuer in services/auth-service/cmd/main.go)
        algorithm: HS256
        secret: secret_change_me # local-dev default; override to match JWT_SECRET in real deployments

# Global plugin (no service/route scoping) — originates a trace for every
# proxied request and exports it to the Collector, which fans it out to
# Tempo/Prometheus(spanmetrics)/the service graph. Downstream Go services
# join this trace by extracting the traceparent header the plugin injects.
plugins:
  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong
      propagation:
        default_format: w3c

services:
  # -- auth-service: /signup, /login, /refresh are public (no token yet) --
  - name: auth-service-public
    url: http://auth-service:8000
    routes:
      - name: auth-public
        paths:
          - /api/auth
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: ip
          minute: 300 # brute-force guard on signup/login/refresh; no user identity yet — high enough for e2e-test's startup burst (signup+login for every actor and its decoy, all from one IP)

  # -- auth-service: GET /users is an admin listing, requires Admin role --
  - name: auth-service-users
    url: http://auth-service:8000/users
    routes:
      - name: auth-users
        paths:
          - /api/auth/users
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - &inject_user_headers |
              local cjson = require("cjson.safe")
              for _, h in ipairs({ "X-User-Id", "X-User-Email", "X-User-Role", "X-Client-Id" }) do
                kong.service.request.clear_header(h)
              end
              local auth_header = kong.request.get_header("authorization") or ""
              local token = auth_header:match("^[Bb]earer%s+(.+)$")
              if token then
                local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
                if payload_b64 then
                  payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
                  local pad = #payload_b64 % 4
                  if pad > 0 then
                    payload_b64 = payload_b64 .. string.rep("=", 4 - pad)
                  end
                  local raw = ngx.decode_base64(payload_b64)
                  local claims = raw and cjson.decode(raw)
                  if claims then
                    if claims.user_id then kong.service.request.set_header("X-User-Id", claims.user_id) end
                    if claims.email then kong.service.request.set_header("X-User-Email", claims.email) end
                    if claims.role then kong.service.request.set_header("X-User-Role", claims.role) end
                    if claims.client_id then kong.service.request.set_header("X-Client-Id", claims.client_id) end
                  end
                end
              end
            - &require_admin |
              if kong.request.get_header("X-User-Role") ~= "Admin" then
                return kong.response.exit(403, { message = "admin role required" })
              end
      - name: rate-limiting
        # NOTE: post-function's own Kong-defined priority is extremely low
        # (it runs last, right before proxying), so rate-limiting actually
        # evaluates limit_by: header BEFORE inject_user_headers sets
        # X-User-Id — the header is empty at that point, and Kong's
        # rate-limiting plugin falls back to the caller's IP. For real
        # traffic (distinct client IPs) that's still a reasonable per-caller
        # limit, just coarser than "per user" in the case of shared
        # IPs/NAT. For e2e-test specifically, every virtual actor shares the
        # simulator process's one IP, so they all share one bucket — hence
        # the generous ceiling below. A precise per-user fix would need
        # Kong's plugin-ordering feature, which is Enterprise-only (tried
        # and confirmed: the OSS `kong:3.7` image rejects the `ordering`
        # field on `rate-limiting` with "unknown field") — not worth the
        # complexity for a local/dev learning-project gateway.
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- auth-service: GET /me is the caller's own profile, requires a valid token --
  - name: auth-service-me
    url: http://auth-service:8000/me
    routes:
      - name: auth-me
        paths:
          - /api/auth/me
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- auth-service: POST /logout revokes a refresh token, requires a valid token --
  - name: auth-service-logout
    url: http://auth-service:8000/logout
    routes:
      - name: auth-logout
        paths:
          - /api/auth/logout
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- ride-service: everything requires a valid token --
  - name: ride-service
    url: http://ride-service:8001
    routes:
      - name: ride-protected
        paths:
          - /api/ride
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 600

  # -- driver-service: everything requires a valid token --
  - name: driver-service
    url: http://driver-service:8003
    routes:
      - name: driver-protected
        paths:
          - /api/driver
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 600

  # -- Admin-only list routes --
  # These match on paths AND methods, which Kong's router ranks above the
  # paths-only ride-service/driver-service routes above, so a GET to these
  # exact paths is caught here (and gated to Admin) instead of falling
  # through to the broader protected routes. Every other method/path under
  # /api/ride and /api/driver (POST /request-ride, PUT .../driver-shift/{id},
  # etc.) is untouched and still resolves to the ordinary routes.
  - name: ride-service-admin-list
    url: http://ride-service:8001/ride
    routes:
      - name: ride-admin-list
        paths:
          - ~/api/ride$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  - name: driver-service-admin-list
    url: http://driver-service:8003/driver
    routes:
      - name: driver-admin-list
        paths:
          - ~/api/driver/driver$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  - name: shift-service-admin-list
    url: http://driver-service:8003/driver-shift
    routes:
      - name: shift-admin-list
        paths:
          - ~/api/driver/driver-shift$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: caller-scoped routes require a valid token; ownership
  # of a payment method/invoice is checked in-service against X-Client-Id,
  # not at the gateway (Kong has no concept of invoice ownership) --
  - name: billing-service
    url: http://billing-service:8005
    routes:
      - name: billing-protected
        paths:
          - /api/billing
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: GET /invoices is an admin listing, requires Admin
  # role — same paths+methods ranking trick as the other three admin-list
  # routes above (matches ahead of the broader billing-protected route). --
  - name: billing-service-admin-list
    url: http://billing-service:8005/invoices
    routes:
      - name: billing-admin-list
        paths:
          - ~/api/billing/invoices$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: GET /ledger/balance is a debug/regression-test
  # endpoint (e2e-test asserts ledger invariants against it) — Admin-only,
  # same paths+methods ranking trick as the other admin-list routes. --
  - name: billing-service-ledger-balance
    url: http://billing-service:8005/ledger/balance
    routes:
      - name: billing-ledger-balance
        paths:
          - ~/api/billing/ledger/balance$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: Stripe webhook delivery — no jwt, no
  # inject_user_headers. Stripe never has a MyUberGo token; the signature
  # verification inside WebhookHandler (over the RAW body, against
  # STRIPE_WEBHOOK_SECRET) is the actual auth boundary here, not Kong. Only
  # registered by cmd/main.go when PAYMENT_PROVIDER=stripe — with the stub
  # provider this route 404s at billing-service, which is fine since nothing
  # is configured to deliver to it in that mode. Same paths+methods ranking
  # trick as the admin routes above, so this wins over the broader
  # billing-protected route despite being declared after it. --
  - name: billing-service-webhook
    url: http://billing-service:8005/webhooks/stripe
    routes:
      - name: billing-webhook-stripe
        paths:
          - ~/api/billing/webhooks/stripe$
        methods:
          - POST
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: ip
          minute: 300 # Stripe test-mode delivery + retries; no user identity to key off

  # matching-service (8002) is Kafka/Redis-driven internally and has no
  # gateway-facing consumer today (see CLAUDE.md "Matching algorithm
  # status") — intentionally not routed here.
