_format_version: "3.0"
_transform: true

# Single consumer for "any authenticated MyUberGo user" — every token shares one iss/secret.
# Per-user identity/rate-limiting instead keys off the injected X-User-* headers, not the consumer.
consumers:
  - username: myubergo-app
    jwt_secrets:
      - key: myubergo-auth # must match the "iss" claim auth-service mints (see tokenIssuer in services/auth-service/cmd/main.go)
        algorithm: HS256
        secret: secret_change_me # local-dev default; override to match JWT_SECRET in real deployments

# Global plugin — originates a trace for every proxied request, exported to the Collector.
# Downstream Go services join it by extracting the traceparent header this plugin injects.
plugins:
  - name: opentelemetry
    config:
      endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: kong
        # Mirrors the 5 Go services' OTEL_RESOURCE_ATTRIBUTES so Kong's spans land in the same
        # Tempo/Grafana facets. Static file, no env substitution — keep "local" in sync by hand if APP_ENV changes.
        service.namespace: myubergo
        deployment.environment: local
      propagation:
        # Pin to w3c on both ends: without this allowlist an external caller could inject an
        # arbitrary trace ID via b3/jaeger/aws headers. `preserve` on inject just forwards format, never rewrites.
        extract:
          - w3c
        inject:
          - preserve
          - w3c
        default_format: w3c

services:
  # -- auth-service: /signup, /login, /refresh are public (no token yet) --
  - name: auth-service-public
    url: http://auth-service:8000
    routes:
      - name: auth-public
        paths:
          - /api/auth
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: ip
          minute: 300 # brute-force guard on signup/login/refresh; no user identity yet — high enough for e2e-test's startup burst (signup+login for every actor and its decoy, all from one IP)

  # -- auth-service: GET /users is an admin listing, requires Admin role --
  - name: auth-service-users
    url: http://auth-service:8000/users
    routes:
      - name: auth-users
        paths:
          - /api/auth/users
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - &inject_user_headers |
              local cjson = require("cjson.safe")
              for _, h in ipairs({ "X-User-Id", "X-User-Email", "X-User-Role", "X-Client-Id" }) do
                kong.service.request.clear_header(h)
              end
              local auth_header = kong.request.get_header("authorization") or ""
              local token = auth_header:match("^[Bb]earer%s+(.+)$")
              if token then
                local payload_b64 = token:match("^[^.]+%.([^.]+)%.")
                if payload_b64 then
                  payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
                  local pad = #payload_b64 % 4
                  if pad > 0 then
                    payload_b64 = payload_b64 .. string.rep("=", 4 - pad)
                  end
                  local raw = ngx.decode_base64(payload_b64)
                  local claims = raw and cjson.decode(raw)
                  if claims then
                    if claims.user_id then kong.service.request.set_header("X-User-Id", claims.user_id) end
                    if claims.email then kong.service.request.set_header("X-User-Email", claims.email) end
                    if claims.role then kong.service.request.set_header("X-User-Role", claims.role) end
                    if claims.client_id then kong.service.request.set_header("X-Client-Id", claims.client_id) end
                  end
                end
              end
            - &require_admin |
              if kong.request.get_header("X-User-Role") ~= "Admin" then
                return kong.response.exit(403, { message = "admin role required" })
              end
      - name: rate-limiting
        # NOTE: rate-limiting's low priority means it runs before inject_user_headers sets X-User-Id,
        # so it falls back to caller IP (hence the generous ceiling) — per-user ordering needs Kong Enterprise.
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- auth-service: GET /me is the caller's own profile, requires a valid token --
  - name: auth-service-me
    url: http://auth-service:8000/me
    routes:
      - name: auth-me
        paths:
          - /api/auth/me
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- auth-service: POST /logout revokes a refresh token, requires a valid token --
  - name: auth-service-logout
    url: http://auth-service:8000/logout
    routes:
      - name: auth-logout
        paths:
          - /api/auth/logout
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- ride-service: everything requires a valid token --
  - name: ride-service
    url: http://ride-service:8001
    routes:
      - name: ride-protected
        paths:
          - /api/ride
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 600

  # -- driver-service: everything requires a valid token --
  - name: driver-service
    url: http://driver-service:8003
    routes:
      - name: driver-protected
        paths:
          - /api/driver
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 600

  # -- Admin-only list routes: match on paths AND methods, which Kong ranks above the paths-only
  # routes above, so a GET here is gated to Admin; every other method/path is untouched. --
  - name: ride-service-admin-list
    url: http://ride-service:8001/ride
    routes:
      - name: ride-admin-list
        paths:
          - ~/api/ride$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  - name: driver-service-admin-list
    url: http://driver-service:8003/driver
    routes:
      - name: driver-admin-list
        paths:
          - ~/api/driver/driver$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  - name: shift-service-admin-list
    url: http://driver-service:8003/driver-shift
    routes:
      - name: shift-admin-list
        paths:
          - ~/api/driver/driver-shift$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: caller-scoped routes require a valid token; ownership of a payment
  # method/invoice is checked in-service against X-Client-Id, not at the gateway --
  - name: billing-service
    url: http://billing-service:8005
    routes:
      - name: billing-protected
        paths:
          - /api/billing
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: GET /invoices is Admin-only, same paths+methods ranking
  # trick as the other admin-list routes (matches ahead of billing-protected). --
  - name: billing-service-admin-list
    url: http://billing-service:8005/invoices
    routes:
      - name: billing-admin-list
        paths:
          - ~/api/billing/invoices$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: GET /ledger/balance is a debug/regression endpoint (e2e-test asserts
  # ledger invariants against it) — Admin-only, same ranking trick as the other admin routes. --
  - name: billing-service-ledger-balance
    url: http://billing-service:8005/ledger/balance
    routes:
      - name: billing-ledger-balance
        paths:
          - ~/api/billing/ledger/balance$
        methods:
          - GET
        strip_path: true
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - *inject_user_headers
            - *require_admin
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: header
          header_name: X-User-Id
          minute: 300

  # -- billing-service: Stripe webhook — no jwt/inject_user_headers; WebhookHandler's own signature
  # check over the raw body is the real auth boundary. Only registered under PAYMENT_PROVIDER=stripe. --
  - name: billing-service-webhook
    url: http://billing-service:8005/webhooks/stripe
    routes:
      - name: billing-webhook-stripe
        paths:
          - ~/api/billing/webhooks/stripe$
        methods:
          - POST
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          policy: redis
          redis_host: redis
          redis_port: 6379
          limit_by: ip
          minute: 300 # Stripe test-mode delivery + retries; no user identity to key off

  # matching-service (8002) is Kafka/Redis-driven internally with no gateway-facing
  # consumer today (see CLAUDE.md "Matching algorithm status") — intentionally not routed here.
