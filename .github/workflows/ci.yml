name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - ride-service
          - driver-service
          - matching-service
          - billing-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v6's default golangci-lint (1.64.8, built with Go 1.24) can't
          # parse a `go 1.26` toolchain directive in go.mod. Pinned to the
          # v2 release actually verified locally against this repo's
          # .golangci.yml (v2 schema) and go1.26 modules.
          version: v2.12.2
          working-directory: services/${{ matrix.service }}
          args: --config=${{ github.workspace }}/.golangci.yml

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
