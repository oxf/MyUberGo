# Same-origin API proxy mirroring vite.config.ts's dev-server proxy, so the
# Go services still need no CORS handling in the containerized dashboard
# either. Backend hosts here are docker-compose service names, not localhost.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
    }

    location /api/ride/ {
        rewrite ^/api/ride/(.*)$ /$1 break;
        proxy_pass http://ride-service:8001;
        proxy_set_header Host $host;
    }

    location /api/driver/ {
        rewrite ^/api/driver/(.*)$ /$1 break;
        proxy_pass http://driver-service:8003;
        proxy_set_header Host $host;
    }

    # React Router (BrowserRouter) client-side routes
    location / {
        try_files $uri /index.html;
    }
}
