# Same-origin API proxy mirroring vite.config.ts's dev-server proxy, so the
# Go services still need no CORS handling in the containerized dashboard
# either. All /api/* traffic now goes to Kong (the API gateway), which does
# its own path-prefix stripping and JWT verification — see gateway/kong.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
    }

    # React Router (BrowserRouter) client-side routes
    location / {
        try_files $uri /index.html;
    }
}
