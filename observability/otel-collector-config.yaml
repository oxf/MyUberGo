receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Consumer-group lag per topic — the key async health signal for this repo's outbox/Kafka
  # pipeline. Scrapes Kafka's own broker metadata, not application code.
  kafkametrics:
    brokers: ["kafka:29092"]
    protocol_version: "2.8.0"
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 30s

extensions:
  # Exposes GET /health(z) on :13133 for the collector's own container healthcheck —
  # otherwise depends_on: service_started elsewhere couldn't tell "up" from "actually accepting data".
  health_check:
    endpoint: 0.0.0.0:13133

  # Backs sending_queue.storage on every exporter below — without this the queue is
  # in-memory only, so a restart or OOM silently drops everything still buffered.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true

processors:
  # Must be the first processor in every pipeline: protects the collector
  # itself from OOM if a burst of telemetry arrives faster than it can export.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 1024

connectors:
  # Derives RED metrics (rate/error/duration) per service/operation directly from the
  # traces pipeline's spans — no extra instrumentation needed in any Go service.
  spanmetrics:
    namespace: traces.span.metrics
    dimensions:
      # otelhttp v0.69 emits STABLE semconv (http.request.method, not http.method) — the old name
      # matched nothing. rpc.system dropped (no gRPC here); messaging dims matter for this Kafka-driven system.
      - name: http.request.method
      - name: http.route
      - name: messaging.system
      - name: messaging.destination.name
      - name: messaging.operation.name
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    exemplars:
      enabled: true

  # Derives the service dependency graph (incl. Kafka producer/consumer
  # edges) from span parent/child relationships.
  servicegraph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    store:
      # The outbox worker's 2s poll ticker puts producer/consumer spans routinely several
      # seconds apart — past the previous 2s TTL, which dropped exactly the async Kafka edges worth seeing.
      ttl: 30s
      max_items: 20000

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true

  # Prometheus' native OTLP receiver: POST /api/v1/otlp/v1/metrics. otlphttp
  # appends "/v1/metrics" to the configured endpoint itself.
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true

  # Loki's native OTLP ingest: POST /otlp/v1/logs. otlphttp appends
  # "/v1/logs" to the configured endpoint itself.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    sending_queue:
      enabled: true
      storage: file_storage
    retry_on_failure:
      enabled: true

service:
  extensions: [health_check, file_storage]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics, servicegraph]

    metrics:
      receivers: [otlp, kafkametrics, spanmetrics, servicegraph]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

  telemetry:
    logs:
      level: info
    # The collector's own health (export failures, dropped spans, queue size) was previously
    # invisible; exposed here as a Prometheus endpoint (see prometheus.yaml's otel-collector job).
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
