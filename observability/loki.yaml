auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Services carry no explicit log labels beyond service.name (see resource
  # attributes in the OTel logging setup) — keep structured fields out of the
  # label set, everything else goes into the queryable log line body.
  allow_structured_metadata: true
  volume_enabled: true
