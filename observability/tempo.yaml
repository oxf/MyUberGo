server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Lets Tempo answer Prometheus-style metric queries derived from the
# spanmetrics/servicegraph connectors in the Collector, and lets Grafana's
# Tempo datasource query span metrics without a separate config.
metrics_generator:
  storage:
    path: /var/tempo/generator/wal
