server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Explicit retention, not the image's monolithic-mode default — this block was previously
# dropped as a side effect of an unrelated fix, so trace data accumulated in tempo-data forever.
compactor:
  compaction:
    block_retention: 48h
